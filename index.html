<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雅思学习 (Vue 3 版本)</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--sub:#6e6e73;--blue:#0071e3;--chip:#e8f1fc;--line:#e5e5ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#98989d;--blue:#2997ff;--chip:#0a2a4a;--line:#2c2c2e}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#98989d;--blue:#2997ff;--chip:#0a2a4a;--line:#2c2c2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans",Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
header b{font-size:17px}
#back{border:0;background:none;color:var(--blue);font-size:17px;cursor:pointer;padding:6px 0;visibility:hidden}
.seg{display:flex;background:var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;color:var(--text);font:600 13px inherit;font-family:inherit;padding:5px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.2)}
main{max-width:720px;margin:0 auto;padding:8px 20px 48px}
h1{font-size:34px;line-height:1.15;margin:12px 0 4px;letter-spacing:-.02em}
.lead{color:var(--sub);margin:0 0 20px}
.card{position:relative;background:var(--card);border-radius:20px;padding:20px;margin-bottom:14px}
.close{position:absolute;top:12px;right:14px;z-index:2;border:0;background:var(--chip);color:var(--blue);font:600 12px inherit;font-family:inherit;padding:4px 10px;border-radius:99px;cursor:pointer}
.close:hover{filter:brightness(.95)}
.tile{display:block;width:100%;text-align:left;border:0;color:inherit;font:inherit;cursor:pointer}
.tile h2{margin:0 0 4px;font-size:22px}
.tile p{margin:0;color:var(--sub)}
.tile .ic{font-size:30px;margin-bottom:8px}
.tile.soon{opacity:.55;cursor:default}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid .card{margin:0}
input[type=search]{width:100%;border:0;background:var(--line);color:var(--text);font:inherit;padding:10px 14px;border-radius:12px;margin-bottom:12px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 12px;margin:0 -20px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:0;background:var(--line);color:var(--text);font:600 13px inherit;font-family:inherit;padding:6px 14px;border-radius:999px;cursor:pointer}
.cats button.on{background:var(--blue);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--sub);font-size:14px}
.sw{border:0;background:var(--chip);color:var(--blue);font:600 13px inherit;font-family:inherit;padding:6px 12px;border-radius:99px;cursor:pointer}
.word{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.word b{font-size:20px}
.word span{color:var(--sub);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--chip);color:var(--blue);border-radius:99px;padding:3px 11px;font-size:14px}
.hid .chips{filter:blur(7px);cursor:pointer}
.hid.show .chips{filter:none}
.ph{border:0;background:none;color:var(--blue);font:inherit;font-size:14px;cursor:pointer;padding:2px 9px;border-radius:99px;transition:background .15s,transform .1s}
.ph:hover{background:var(--chip)}
.ph:active{transform:scale(.95)}
.chip{cursor:pointer;transition:transform .12s,filter .12s}
.chip:hover{transform:translateY(-1px);filter:brightness(.93)}
.chip:active{transform:scale(.96)}
.chip .ip{font-style:normal;font-size:12px;margin-left:6px;opacity:.75}
.ex{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.ex>div{overflow:hidden}
.show .ex{grid-template-rows:1fr}
.exb{margin-top:14px;padding:14px;border-radius:14px;background:var(--bg);position:relative}
.exb p{margin:0;padding-right:38px;font-size:16px;line-height:1.65}
.exb small{display:block;margin-top:6px;color:var(--sub);font-size:13px}
.exb mark{background:var(--chip);color:var(--blue);padding:0 4px;border-radius:5px;font-weight:600}
.play{position:absolute;top:10px;right:10px;width:30px;height:30px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;cursor:pointer;transition:transform .12s,filter .12s}
.play:hover{filter:brightness(1.1);transform:scale(1.08)}
.hw{cursor:pointer;border-radius:8px;padding:0 5px;margin:0 -5px;transition:background .15s,color .15s}
.hw:hover{background:var(--chip);color:var(--blue)}
.hw:active{transform:scale(.97)}
.exw{font-weight:600;font-size:14px;color:var(--sub);margin-bottom:8px}
.ps{font-style:italic;font-weight:400;color:var(--sub);font-size:13px;margin:0 6px}
.exw .zh{color:var(--text);font-size:15px}
.chip .ps{font-size:11px;margin:0 0 0 5px;color:inherit;opacity:.7}
.play .eq{display:flex;gap:2px;align-items:flex-end;height:12px}
.play .eq i{width:3px;background:#fff;border-radius:2px;animation:eq .8s ease-in-out infinite}
.play .eq i:nth-child(2){animation-delay:.2s}
.play .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.play{display:flex;align-items:center;justify-content:center}
.play.on{box-shadow:0 0 0 4px var(--chip)}
.wd{cursor:pointer;transition:background .12s}
.wd:hover{background:var(--chip);border-radius:3px}
.tip{position:absolute;top:8px;right:84px;z-index:3;max-width:62%;background:var(--card);color:var(--text);border-radius:12px;padding:6px 12px;font-size:14px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.2);pointer-events:auto}
.ti{color:var(--blue);font-size:13px;margin-left:6px}
.tsay{border:0;background:var(--chip);color:var(--blue);border-radius:99px;padding:1px 9px;margin-left:8px;cursor:pointer;font-size:13px}
.tsay:hover{filter:brightness(.93)}
.tip b{color:var(--blue)}
.tip .ps{margin:0 6px}
.tip,.tip.art{right:auto;width:max-content;max-width:min(340px,92%);padding-top:8px}
.play.rep{right:46px;background:var(--line);color:var(--text)}
.play.rep.on{background:var(--blue);color:#fff}
.play.rep.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
article p{font-size:18px;line-height:1.7;margin:0}
article mark{background:var(--chip);color:var(--blue);padding:0 4px;border-radius:5px;font-weight:600}
.hint{color:var(--sub);font-size:14px;margin-top:14px}
.ico{position:relative;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;transform:perspective(260px) rotateX(10deg) rotateY(-10deg);transition:transform .25s}
.tile:hover .ico{transform:perspective(260px) rotateX(0) rotateY(0) scale(1.05)}
.ico::before{content:"";position:absolute;left:3px;right:3px;top:3px;height:46%;border-radius:13px 13px 40px 40px;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0))}
.ico svg{position:relative;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.i1{background:linear-gradient(145deg,#64d2ff,#0071e3 70%);box-shadow:0 12px 22px rgba(0,113,227,.4),inset 0 -5px 8px rgba(0,0,0,.25),inset 0 1px 1px rgba(255,255,255,.7)}
.i2{background:linear-gradient(145deg,#8e8cff,#4b3fd9 70%);box-shadow:0 12px 22px rgba(75,63,217,.4),inset 0 -5px 8px rgba(0,0,0,.25),inset 0 1px 1px rgba(255,255,255,.7)}
</style>
</head>
<body>
<div id="app">
<header>
  <button id="back" :style="{visibility: view==='home' ? 'hidden' : 'visible'}" @click="back">‹ 返回</button>
  <b>{{ title }}</b>
  <div class="seg">
    <button :class="{on: lang==='uk'}" @click="lang='uk'">英</button>
    <button :class="{on: lang==='us'}" @click="lang='us'">美</button>
  </div>
</header>
<main>
  <template v-if="view==='home'">
    <h1>开始学习</h1>
    <p class="lead">{{ lang==='uk' ? '当前：英式英语' : '当前：美式英语' }}</p>
    <button class="card tile" @click="go('syn')"><div class="ico i1"><svg viewBox="0 0 48 48" width="30" height="30"><g fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17h27l-7-7M38 31H11l7 7"/></g></svg></div><h2>同义词替换</h2><p>{{ SYN.length }} 组考试高频词，写作口语都能用</p></button>
    <button class="card tile" @click="go('topics')"><div class="ico i2"><svg viewBox="0 0 48 48" width="30" height="30"><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 7 6 16l18 9 18-9z"/><path d="M6 25l18 9 18-9"/><path d="M6 34l18 9 18-9"/></g></svg></div><h2>话题分类</h2><p>教育、科学、医疗等主题短文和重点词</p></button>
    <div class="card tile soon"><div class="ic">🎧</div><h2>即将推出</h2><p>第三个板块，之后再定</p></div>
  </template>

  <template v-else-if="view==='syn'">
    <h1>同义词替换</h1>
    <input type="search" v-model="q" placeholder="搜索单词或中文">
    <div class="cats"><button v-for="c in CATS" :key="c" :class="{on: cat===c}" @click="cat=c">{{ c }}</button></div>
    <div class="row"><span>{{ list.length }} 组，点单词展开例句</span><button class="sw" @click="toggleQuiz">{{ quiz ? '关闭自测' : '开启自测' }}</button></div>
    <div v-for="r in list" :key="r[0]" class="card" :class="{hid: quiz, show: shown[r[0]]}" @click="shown[r[0]] = true">
      <button class="close" v-if="shown[r[0]]" @click.stop="shown[r[0]] = false; tip = null">收起 ▴</button>
      <div class="word"><b class="hw" @click="pickHead(r[0], $event)">{{ T(r[0]) }}</b><i class="ps" v-if="NU[r[0]]">{{ NU[r[0]][0] }}</i><button class="ph" v-if="ipa(r[0])" @click="playing = ''; looping = ''; say(r[0], $event, r[0])">/{{ ipa(r[0]) }}/ 🔊</button><span>{{ r[2] }}</span></div>
      <div class="chips"><span class="chip" v-for="w in r[1].split(' · ')" :key="w" @click="pickSyn(w, $event, r[0])" :title="NU[w] ? NU[w][1] : ''">{{ T(w) }}<i class="ps" v-if="NU[w]">{{ NU[w][0] }}</i><i class="ip" v-if="ipa(w)">/{{ ipa(w) }}/</i></span></div>
      <div class="ex"><div><div class="exb" @mouseleave="tip = null"><div class="exw">{{ T(cur(r[0])) }}<template v-if="NU[cur(r[0])]"><i class="ps">{{ NU[cur(r[0])][0] }}</i><span class="zh">{{ NU[cur(r[0])][1] }}</span></template></div><template v-if="EX[cur(r[0])]"><button class="play rep" :class="{on: looping === EX[cur(r[0])][0], spin: looping === EX[cur(r[0])][0]}" @click="toggleLoop(EX[cur(r[0])][0], $event)" :title="looping === EX[cur(r[0])][0] ? '关闭循环' : '循环播放'"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg></button><button class="play" :class="{on: playing === EX[cur(r[0])][0]}" @click="sayText(EX[cur(r[0])][0], $event)" :title="playing === EX[cur(r[0])][0] ? '停止' : '朗读例句'"><span class="eq" v-if="playing === EX[cur(r[0])][0]"><i></i><i></i><i></i></span><template v-else>▶</template></button><p v-html="wrap(exHtml(cur(r[0])))" @mouseover="showTip($event, r[0])" @click.stop="showTip($event, r[0]); clickSay($event)"></p><div class="tip" :style="{left: tipPos.x + 'px', top: tipPos.y + 'px'}" v-if="tip && tip.k === r[0]"><b>{{ tip.w }}</b><i class="ps">{{ tip.pos }}</i>{{ tip.zh }}<span class="ps" v-if="tip.base !== tip.w.toLowerCase()">({{ tip.base }})</span><span class="ti" v-if="tipIpa(tip)">/{{ tipIpa(tip) }}/</span><button class="tsay" @click.stop="speakWord(tip.w)" title="发音">🔊</button></div><small>{{ EX[cur(r[0])][1] }}</small></template><p v-else class="hint" style="margin:0">这个词的例句还在补充中</p></div></div></div>
    </div>
    <p class="hint" v-if="quiz">自测模式：点卡片显示同义词</p>
  </template>

  <template v-else-if="view==='topics'">
    <h1>话题分类</h1>
    <p class="lead">选一个主题阅读</p>
    <div class="grid">
      <button class="card tile" v-for="(r,i) in ART" :key="i" @click="openArt(i)"><div class="ic">{{ r[1] }}</div><h2 style="font-size:17px">{{ r[0] }}</h2></button>
    </div>
  </template>

  <template v-else>
    <h1>{{ ART[artIdx][0] }}</h1>
    <div class="card"><article style="position:relative" @mouseleave="tip = null"><p v-html="wrap(articleHtml)" @mouseover="showTip($event, 'art')" @click="showTip($event, 'art'); clickSay($event)"></p><div class="tip art" :style="{left: tipPos.x + 'px', top: tipPos.y + 'px'}" v-if="tip && tip.k === 'art'"><b>{{ tip.w }}</b><i class="ps">{{ tip.pos }}</i>{{ tip.zh }}<span class="ps" v-if="tip.base !== tip.w.toLowerCase()">({{ tip.base }})</span><span class="ti" v-if="tipIpa(tip)">/{{ tipIpa(tip) }}/</span><button class="tsay" @click.stop="speakWord(tip.w)" title="发音">🔊</button></div></article></div>
    <p class="hint">蓝色标记是可积累的高频词</p>
  </template>
</main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script>

          try { localStorage.setItem("ielts-dyn", JSON.stringify(dyn)); } catch (e) {}
          ipaTick.value++;
        } catch (e) {}
      }, 350);
    };
    const exHtml = (k) => T(EX[k][0]).replace(/\*\*(.+?)\*\*/g, "<mark>$1</mark>");
    const ipa = (w) => { const s = IPA[w]; if (!s) return ""; const p = s.split("|"); return lang.value === "uk" ? p[0] : (p[1] || p[0]); };
    const say = (w, ev, key) => {
      if (quiz.value && !shown.value[key]) return;
      ev.stopPropagation();
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(T(w));
      u.lang = lang.value === "uk" ? "en-GB" : "en-US";
      const v = pick(u.lang);
      if (v) u.voice = v;
      u.rate = 0.92;
      speechSynthesis.speak(u);
    };
    const cat = ref("全部");
    const list = computed(() => SYN.filter(r => (cat.value === "全部" || (CAT[r[0]] || "通用") === cat.value) && (!q.value || (r[0] + r[1] + r[2]).toLowerCase().includes(q.value.toLowerCase()))));
    const title = computed(() => view.value === "home" ? "雅思学习 (Vue 3 版本)" : view.value === "syn" ? "同义词" : view.value === "topics" ? "话题" : ART[artIdx.value][0].split(" ")[0]);
    const articleHtml = computed(() => T(ART[artIdx.value][2]).replace(/\*\*(.+?)\*\*/g, "<mark>$1</mark>"));
    const go = (v) => { view.value = v; q.value = ""; };
    const openArt = (i) => { artIdx.value = i; view.value = "art"; };
    const back = () => { view.value = view.value === "art" ? "topics" : "home"; };
    const toggleQuiz = () => { quiz.value = !quiz.value; shown.value = {}; };
    watch([view, artIdx], () => window.scrollTo(0, 0));
    return { tipPos, clickSay, cat, CATS, speakWord, tipIpa, looping, toggleLoop, tip, showTip, wrap, playing, NU, cur, pickSyn, pickHead, EX, exHtml, sayText, ipa, say, lang, view, artIdx, quiz, q, shown, T, list, title, articleHtml, go, openArt, back, toggleQuiz, SYN, ART };
  }
}).mount("#app");
